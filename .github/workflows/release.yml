name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the checked package version
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.12'
      - id: version
        run: python scripts/release-version.py
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.2'
      - run: npm install --global npm@12.2.0 pnpm@11.25.0
      - run: python3 -m unittest discover -s scripts -p test_release_version.py
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate && git diff --exit-code
      - run: pnpm lint && pnpm typecheck && node check-claims.mjs
      - run: pnpm build && pnpm test
      - run: mkdir artifacts && npm pack --ignore-scripts --pack-destination artifacts
      - name: Install the packed public entry point
        run: |
          mkdir /tmp/sdk-install
          npm install --prefix /tmp/sdk-install --ignore-scripts --no-audit --no-fund "$PWD"/artifacts/*.tgz
          cd /tmp/sdk-install
          node --input-type=module -e 'import { ProoflineClient } from "@proofline/sdk"; if (typeof ProoflineClient !== "function") process.exit(1)'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: artifacts/*
          if-no-files-found: error
  publish:
    if: github.event_name == 'push' || inputs.publish
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: artifacts
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.2'
      - run: npm install --global npm@12.2.0
      - run: npm publish artifacts/*.tgz --access public --provenance --ignore-scripts
