name: Checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.2'
      - run: npm install --global npm@12.2.0 pnpm@11.25.0
      - run: python3 -m unittest discover -s scripts -p test_release_version.py
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate && git diff --exit-code
      - run: pnpm lint && pnpm typecheck && node check-claims.mjs
      - run: pnpm build && pnpm test
      - run: mkdir artifacts && npm pack --ignore-scripts --pack-destination artifacts
